<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA DE RIFA EN VIVO</title>
<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// 🔑 Configuración de Firebase (reemplaza con tus datos reales)
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_DOMINIO.firebaseapp.com",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_BUCKET.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const appId = 'rifa_produccion_final';

let rifaData = Array(100).fill(null);
let user = null;
let currentNumIndex = null;
let accionPendiente = null;

const CLAVE_MAESTRA = "1234";

// --- AUTENTICACIÓN ---
const initAuth = async () => {
  try {
    await signInAnonymously(auth);
  } catch (error) {
    console.error("Error crítico de acceso:", error);
  }
};

onAuthStateChanged(auth, (u) => {
  user = u;
  if (user) {
    console.log("Sesión activa:", user.uid);
    conectarBaseDeDatos();
  }
});

// --- FIREBASE ---
function getDocRef() {
  return doc(db, 'artifacts', appId, 'public', 'data', 'rifa_global', 'estado_oficial');
}

function conectarBaseDeDatos() {
  const docRef = getDocRef();
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      rifaData = data.numeros || Array(100).fill(null);
    } else {
      actualizarServidor(Array(100).fill(null));
    }
    renderizarPantalla();
  }, (error) => {
    console.error("Error de lectura:", error);
  });
}

async function actualizarServidor(nuevaData) {
  if (!user) return;
  try {
    const docRef = getDocRef();
    const dataLimpia = nuevaData.map(item => item ? { nombre: item.nombre, telefono: item.telefono } : null);
    await setDoc(docRef, { numeros: dataLimpia });
  } catch (error) {
    console.error("Error al guardar en servidor:", error);
  }
}

// --- INTERFAZ ---
window.renderizarPantalla = function() {
  const grid = document.getElementById('grid-rifa');
  if (!grid) return;
  grid.innerHTML = '';
  let contador = 0;
  rifaData.forEach((dato, i) => {
    const ocupado = dato !== null;
    const celda = document.createElement('div');
    celda.className = `h-14 flex items-center justify-center rounded-xl text-2xl font-black cursor-pointer transition-all active:scale-90 select-none shadow-sm ${ocupado ? 'bg-red-600 text-white shadow-inner border-b-4 border-red-800' : 'bg-white text-zinc-800 border-2 border-zinc-100 hover:border-red-400'}`;
    celda.innerText = i.toString().padStart(2, '0');
    celda.onclick = () => abrirVentana(i);
    grid.appendChild(celda);
    if (ocupado) contador++;
  });
  document.getElementById('vendidos-count').innerText = contador;
};

window.abrirVentana = function(index) {
  currentNumIndex = index;
  const data = rifaData[index];
  const estaOcupado = data !== null;
  document.getElementById('modal-titulo').innerText = estaOcupado ? "Número Reservado" : "Elegir Número";
  document.getElementById('num-badge').innerText = `#${index.toString().padStart(2, '0')}`;
  document.getElementById('in-nombre').value = estaOcupado ? data.nombre : '';
  document.getElementById('in-tel').value = estaOcupado ? data.telefono : '';
  document.getElementById('btn-confirmar').classList.toggle('hidden', estaOcupado);
  document.getElementById('btn-borrar').classList.toggle('hidden', !estaOcupado);
  document.getElementById('modal-main').classList.remove('hidden');
};

window.cerrarVentana = function() {
  document.getElementById('modal-main').classList.add('hidden');
};

window.confirmarReserva = async function() {
  const nom = document.getElementById('in-nombre').value.trim();
  const tel = document.getElementById('in-tel').value.trim() || "N/A";
  if (!nom) return alert("Escribe un nombre para guardar.");
  rifaData[currentNumIndex] = { nombre: nom, telefono: tel };
  await actualizarServidor(rifaData);
  cerrarVentana();
};

// --- LIBERAR NÚMERO CON CLAVE ---
window.liberarNumero = function() {
  accionPendiente = 'liberar';
  document.getElementById('input-pass').value = '';
  document.getElementById('modal-pass').classList.remove('hidden');
};

window.verificarClave = async function() {
  const pass = document.getElementById('input-pass').value;
  if (pass === CLAVE_MAESTRA) {
    if (accionPendiente === 'liberar') {
      rifaData[currentNumIndex] = null;
      await actualizarServidor(rifaData);
      cerrarVentana();
      renderizarPantalla();
      alert("Número liberado correctamente");
    }
    if (accionPendiente === 'admin') {
      abrirPanelAdmin();
    }
    document.getElementById('modal-pass').classList.add('hidden');
  } else {
    alert("Clave incorrecta.");
  }
};

window.panelAdmin = function() {
  accionPendiente = 'admin';
  document.getElementById('input-pass').value = '';
  document.getElementById('modal-pass').classList.remove('hidden');
};

function abrirPanelAdmin() {
  const listado = document.getElementById('lista-cuerpo');
  listado.innerHTML = '';
  let hay = false;
  rifaData.forEach((d, i) => {
    if (d) {
      hay = true;
      listado.innerHTML += `<tr class="border-b"><td class="p-3 font-bold text-red-600">#${i.toString().padStart(2, '0')}</td><td class="p-3 font-bold uppercase text-xs">${d.nombre}</td><td class="p-3 text-xs">${d.telefono}</td></tr>`;
    }
  });
  if (!hay) listado.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-zinc-400 font-bold uppercase text-[10px]">No hay ventas</td></tr>';
  document.getElementById('panel-admin').classList.remove('hidden');
}

initAuth();
</script>

@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');

</head>
