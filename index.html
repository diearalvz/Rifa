<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RIFA</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoA7Ehq4RlzJ7JC-U12yDZSUk05DdDSMM",
            authDomain: "rifa-mayo.firebaseapp.com",
            projectId: "rifa-mayo",
            storageBucket: "rifa-mayo.firebasestorage.app",
            messagingSenderId: "18488353754",
            appId: "1:18488353754:web:161d84e9ffca868de596e3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const appId = 'rifa_mayo_29_diego';
        let rifaData = Array(100).fill(null);
        let user = null;
        let currentNumIndex = null;
        const CLAVE_MAESTRA = "1234";

        window.addEventListener('DOMContentLoaded', () => {
            renderizarPantalla(); 
        });

        async function iniciarAuth() {
            try {
                await setPersistence(auth, browserLocalPersistence);
                if (!auth.currentUser) await signInAnonymously(auth);
            } catch (err) { setTimeout(iniciarAuth, 1000); }
        }

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) conectarBaseDeDatos();
        });

        iniciarAuth();

        function getDocRef() {
            return doc(db, 'artifacts', appId, 'public', 'data', 'rifa_global', 'estado_oficial');
        }

        function conectarBaseDeDatos() {
            onSnapshot(getDocRef(), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    rifaData = data.numeros || data.numbers || Array(100).fill(null);
                }
                renderizarPantalla();
            });
        }

        async function actualizarServidor(nuevaData) {
            if (!user) return;
            try {
                const dataLimpia = nuevaData.map(item => item ? { 
                    nombre: item.nombre, 
                    telefono: item.telefono
                } : null);
                await setDoc(getDocRef(), { numeros: dataLimpia });
            } catch (error) { console.error("Error al actualizar:", error); }
        }

        window.renderizarPantalla = function() {
            const grid = document.getElementById('grid-rifa');
            if (!grid) return;
            grid.innerHTML = '';
            let contador = 0;
            rifaData.forEach((dato, i) => {
                const ocupado = dato !== null;
                const celda = document.createElement('div');
                celda.className = `h-14 flex items-center justify-center rounded-xl text-xl font-black cursor-pointer transition-all active:scale-90 shadow-md border-2 ${ocupado ? 'bg-orange-600 text-white border-orange-800' : 'bg-white text-slate-800 border-slate-100'}`;
                celda.innerText = i.toString().padStart(2, '0');
                celda.onclick = () => abrirVentana(i);
                grid.appendChild(celda);
                if (ocupado) contador++;
            });
            document.getElementById('vendidos-count').innerText = contador;
        };

        window.abrirVentana = function(index) {
            currentNumIndex = index;
            const data = rifaData[index];
            document.getElementById('num-badge').innerText = `#${index.toString().padStart(2, '0')}`;
            if (data) {
                document.getElementById('modal-info-nombre').innerText = data.nombre;
                document.getElementById('modal-info-tel').innerText = data.telefono || "Sin teléfono";
                document.getElementById('view-registro').classList.add('hidden');
                document.getElementById('view-ocupado').classList.remove('hidden');
                document.getElementById('btn-guardar-modal').classList.add('hidden');
                document.getElementById('btn-liberar-directo').classList.remove('hidden');
            } else {
                document.getElementById('in-nombre').value = '';
                document.getElementById('in-tel').value = '';
                document.getElementById('view-registro').classList.remove('hidden');
                document.getElementById('view-ocupado').classList.add('hidden');
                document.getElementById('btn-guardar-modal').classList.remove('hidden');
                document.getElementById('btn-liberar-directo').classList.add('hidden');
            }
            document.getElementById('modal-main').classList.remove('hidden');
        };

        window.cerrarVentana = () => document.getElementById('modal-main').classList.add('hidden');

        window.guardarReserva = async function() {
            const nom = document.getElementById('in-nombre').value.trim();
            const tel = document.getElementById('in-tel').value.trim();
            if (!nom) return;
            rifaData[currentNumIndex] = { nombre: nom, telefono: tel };
            renderizarPantalla();
            cerrarVentana();
            await actualizarServidor(rifaData);
        };

        window.liberarConClave = function() {
            const pass = prompt("Clave maestra:");
            if (pass === CLAVE_MAESTRA) {
                rifaData[currentNumIndex] = null;
                renderizarPantalla();
                cerrarVentana();
                actualizarServidor(rifaData);
            }
        };

        window.copiarTexto = function(texto, id) {
            const aux = document.createElement("input");
            aux.setAttribute("value", texto.replace(/\s/g, '').replace(/-/g, ''));
            document.body.appendChild(aux);
            aux.select();
            document.execCommand("copy");
            document.body.removeChild(aux);
            const el = document.getElementById(id);
            const original = el.innerText;
            el.innerText = "COPIADO";
            setTimeout(() => el.innerText = original, 1000);
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;900&family=Oswald:wght@700&display=swap');
        
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-title { font-family: 'Bebas Neue', cursive; }
        .font-prize { font-family: 'Bebas Neue', cursive; }

        /* NEÓN AZUL */
        .neon-rifa {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(3.5rem, 16vw, 6rem);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            line-height: 1;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #00d2ff,
                0 0 30px #00d2ff;
        }

        .header-rifa {
            background-color: #0c0f1d;
            background-image: radial-gradient(circle at 50% 30%, #1e293b 0%, #0c0f1d 100%);
        }

        /* AJUSTE PARA EL PREMIO (SIN CURSIVA) */
        .prize-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 15px;
            overflow: hidden;
        }

        .prize-glow {
            font-size: min(14vw, 4.8rem); 
            font-weight: normal; /* Bebas ya es gruesa */
            font-family: 'Bebas Neue', cursive; 
            background: linear-gradient(180deg, #fff 10%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(251, 146, 60, 0.4));
            white-space: nowrap;
            letter-spacing: 1px;
            line-height: 1;
            margin: 0;
            font-style: normal; /* Eliminada la cursiva */
        }

        .valor-cupo-tag {
            background: #ea580c;
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.4);
            transform: translateY(10px);
        }
    </style>
</head>
<body class="bg-slate-200 select-none">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col overflow-x-hidden">
        
        <!-- HEADER -->
        <div class="header-rifa pt-8 pb-14 text-center border-b-4 border-orange-600 relative">
            
            <div class="mb-3">
                <span class="bg-orange-950/50 border border-orange-500/30 text-orange-400 text-[10px] font-black px-4 py-1 rounded-full tracking-[0.2em] uppercase">
                    MAYO 29 • LOTERÍA DE MEDELLÍN
                </span>
            </div>

            <!-- RIFA NEÓN -->
            <div class="mb-1">
                <h1 class="neon-rifa tracking-widest">RIFA</h1>
            </div>

            <!-- PREMIO -->
            <div class="prize-container mb-8">
                <p class="prize-glow">
                    $1.000.000
                </p>
            </div>

            <!-- VALOR CUPO -->
            <div class="inline-flex flex-col valor-cupo-tag px-8 py-3 rounded-2xl border border-white/20">
                <span class="text-[9px] font-black text-orange-100 uppercase tracking-widest mb-1 opacity-90">VALOR</span>
                <span class="font-title text-4xl text-white tracking-widest leading-none">$20.000</span>
            </div>
        </div>

        <!-- ACCESOS RÁPIDOS -->
        <div class="grid grid-cols-3 gap-2 p-3 bg-slate-50 border-b">
            <div onclick="copiarTexto('000-0000', 'bc-lbl')" class="bg-white p-3 rounded-xl border flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-all shadow-sm">
                <span id="bc-lbl" class="text-[8px] font-black text-slate-400 uppercase mb-1">BANCOLOMBIA</span>
                <span class="font-title text-lg text-slate-700">000-0000</span>
            </div>
            <div onclick="copiarTexto('300 000 0000', 'nq-lbl')" class="bg-white p-3 rounded-xl border-b-4 border-b-[#FF00BF] flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-all text-center shadow-sm">
                <span id="nq-lbl" class="text-[8px] font-black text-[#FF00BF] uppercase mb-1">NEQUI</span>
                <span class="font-title text-lg text-slate-700 leading-none">COPIAR</span>
            </div>
            <div class="bg-white p-3 rounded-xl border flex flex-col items-center justify-center shadow-sm">
                <span id="vendidos-count" class="font-title text-3xl text-orange-600 leading-none">0</span>
                <span class="text-[8px] font-bold text-slate-300 uppercase tracking-tighter mt-1">VENDIDOS</span>
            </div>
        </div>

        <!-- TABLERO DE NÚMEROS -->
        <div id="grid-rifa" class="grid grid-cols-4 gap-3 p-5 flex-1 bg-white"></div>

        <div class="p-4 text-center">
            <p class="text-[8px] font-black tracking-[0.4em] text-slate-300 uppercase">PLATAFORMA PREMIUM V4.0</p>
        </div>
    </div>

    <!-- MODAL DE ACCIÓN -->
    <div id="modal-main" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] w-full max-w-xs overflow-hidden shadow-2xl">
            <div class="p-6 text-center bg-slate-50 border-b">
                <p id="num-badge" class="text-8xl font-title text-orange-600 leading-none">#00</p>
            </div>
            <div class="p-6 space-y-4">
                <div id="view-registro" class="space-y-3">
                    <input type="text" id="in-nombre" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-bold outline-none focus:border-orange-500" placeholder="Tu Nombre">
                    <input type="tel" id="in-tel" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-bold outline-none focus:border-orange-500" placeholder="WhatsApp">
                </div>
                <div id="view-ocupado" class="hidden text-center bg-orange-50 p-4 rounded-2xl border border-orange-100">
                    <p class="text-[9px] font-black text-orange-400 uppercase mb-2">RESERVADO POR</p>
                    <p id="modal-info-nombre" class="text-xl font-black text-slate-800">---</p>
                    <p id="modal-info-tel" class="text-xs font-medium text-slate-400 mt-1">---</p>
                </div>
                <button id="btn-guardar-modal" onclick="guardarReserva()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-title text-2xl uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-orange-600/30">RESERVAR</button>
                <button id="btn-liberar-directo" onclick="liberarConClave()" class="hidden w-full text-red-500 font-bold text-[10px] uppercase py-2 tracking-widest">Liberar Cupo</button>
                <button onclick="cerrarVentana()" class="w-full text-slate-400 text-[10px] font-bold uppercase py-2 tracking-widest">Cerrar</button>
            </div>
        </div>
    </div>

</body>
</html>
