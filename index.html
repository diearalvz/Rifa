<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA DE RIFA EN VIVO</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-50 min-h-screen font-sans text-zinc-900 select-none">

<!-- HEADER -->
<div class="bg-red-600 text-white p-6 shadow-lg">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-black tracking-tighter">🎰 RIFA EN VIVO</h1>
    <p class="text-sm opacity-80 mt-1">Selecciona tu número de la suerte</p>
  </div>
</div>

<div class="max-w-6xl mx-auto p-4">
  <!-- INFO PANEL -->
  <div class="bg-white rounded-2xl p-4 shadow-md mb-6 flex justify-between items-center">
    <div>
      <span class="text-xs font-bold text-zinc-400 uppercase">Números vendidos</span>
      <p class="text-3xl font-black text-red-600" id="vendidos-count">0</p>
    </div>
    <button onclick="panelAdmin()" class="bg-zinc-800 hover:bg-black text-white px-6 py-2 rounded-full text-xs font-bold uppercase transition">
      🔐 Admin
    </button>
  </div>

  <!-- GRID DE NÚMEROS -->
  <div id="grid-rifa" class="grid grid-cols-5 md:grid-cols-10 gap-3 mb-6"></div>
</div>

<!-- MODAL DE RESERVA/LIBERACIÓN -->
<div id="modal-main" class="bg-blur fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);">
  <div class="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden shadow-2xl">
    <div class="bg-red-600 p-6 text-white text-center">
      <h2 id="modal-titulo" class="text-xs font-bold uppercase tracking-widest opacity-80 mb-1">Elegir Número</h2>
      <p id="num-badge" class="text-5xl font-black tracking-tighter">#--</p>
    </div>
    <div class="p-6 space-y-4">
      <div class="space-y-1">
        <label class="text-[10px] font-bold text-zinc-400 uppercase ml-1">Nombre del Comprador</label>
        <input type="text" id="in-nombre" class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm font-bold">
      </div>
      <div class="space-y-1">
        <label class="text-[10px] font-bold text-zinc-400 uppercase ml-1">Teléfono</label>
        <input type="tel" id="in-tel" class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm">
      </div>
      <button id="btn-confirmar" onclick="confirmarReserva()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 rounded-xl transition">
        ✅ CONFIRMAR RESERVA
      </button>
      <button id="btn-borrar" onclick="liberarNumero()" class="hidden w-full bg-zinc-800 hover:bg-black text-white font-black py-3 rounded-xl transition">
        🗑️ LIBERAR NÚMERO
      </button>
      <button onclick="cerrarVentana()" class="w-full border-2 border-zinc-200 py-3 rounded-xl font-bold text-sm">
        CANCELAR
      </button>
    </div>
  </div>
</div>

<!-- MODAL VERIFICACIÓN CLAVE -->
<div id="modal-pass" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background: rgba(0,0,0,0.95); backdrop-filter: blur(8px);">
  <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center">
    <div class="text-6xl mb-4">🔐</div>
    <h3 class="text-xl font-black mb-4">Verificación Administrador</h3>
    <input type="password" id="input-pass" placeholder="Ingresa la clave maestra" class="w-full border-2 border-zinc-200 rounded-xl p-3 text-center text-lg font-bold mb-4">
    <button onclick="verificarClave()" class="w-full bg-red-600 text-white font-black py-3 rounded-xl">
      VERIFICAR
    </button>
    <button onclick="document.getElementById('modal-pass').classList.add('hidden')" class="w-full mt-3 text-sm text-zinc-500 py-2">
      Cancelar
    </button>
  </div>
</div>

<!-- PANEL ADMINISTRADOR -->
<div id="panel-admin" class="fixed inset-0 z-50 hidden bg-white overflow-auto">
  <div class="sticky top-0 bg-red-600 text-white p-4 flex justify-between items-center shadow-lg">
    <h2 class="text-xl font-black">📊 REPORTE ADMINISTRADOR</h2>
    <button onclick="document.getElementById('panel-admin').classList.add('hidden')" class="bg-white text-red-600 w-10 h-10 rounded-full font-bold text-xl">✕</button>
  </div>
  
  <div class="p-4 max-w-4xl mx-auto">
    <!-- TABLA DE VENDIDOS -->
    <div class="mb-8">
      <h3 class="text-lg font-black mb-3">🎯 NÚMEROS VENDIDOS</h3>
      <div class="overflow-x-auto">
        <table class="w-full border-collapse">
          <thead class="bg-zinc-100">
            <tr>
              <th class="p-3 text-left text-xs font-black">NÚMERO</th>
              <th class="p-3 text-left text-xs font-black">COMPRADOR</th>
              <th class="p-3 text-left text-xs font-black">TELÉFONO</th>
            </tr>
          </thead>
          <tbody id="lista-cuerpo"></tbody>
        </table>
      </div>
    </div>

    <!-- ESTADÍSTICAS -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-green-50 p-4 rounded-xl border-2 border-green-200">
        <p class="text-xs font-bold text-green-600 uppercase">Total Vendidos</p>
        <p class="text-3xl font-black text-green-700" id="total-vendidos">0</p>
      </div>
      <div class="bg-blue-50 p-4 rounded-xl border-2 border-blue-200">
        <p class="text-xs font-bold text-blue-600 uppercase">Disponibles</p>
        <p class="text-3xl font-black text-blue-700" id="total-disponibles">100</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// 🔑 CONFIGURACIÓN DE FIREBASE - ¡DEBES REEMPLAZAR ESTOS DATOS!
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};

// Inicializar Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Estado global
let rifaData = Array(100).fill(null);
let currentNumIndex = null;
let accionPendiente = null;

const CLAVE_MAESTRA = "1234";
const COLECCION_RIFA = "rifas";
const DOCUMENTO_ID = "numeros_vendidos";

// Autenticación anónima
const initAuth = async () => {
  try {
    await signInAnonymously(auth);
  } catch (error) {
    console.error("Error de autenticación:", error);
    // Modo demo local si falla Firebase
    console.log("Modo offline - usando datos locales");
    renderizarPantalla();
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    console.log("✅ Sesión activa:", user.uid);
    conectarBaseDeDatos();
  } else {
    initAuth();
  }
});

// Referencia al documento en Firestore
function getDocRef() {
  return doc(db, COLECCION_RIFA, DOCUMENTO_ID);
}

// Conectar a Firestore
function conectarBaseDeDatos() {
  const docRef = getDocRef();
  
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      rifaData = data.numeros || Array(100).fill(null);
    } else {
      // Primer uso: crear documento
      actualizarServidor(Array(100).fill(null));
    }
    renderizarPantalla();
    if (document.getElementById('panel-admin') && !document.getElementById('panel-admin').classList.contains('hidden')) {
      actualizarPanelAdmin();
    }
  }, (error) => {
    console.error("❌ Error de lectura:", error);
    // Si falla Firebase, usar datos locales
    if (!rifaData) rifaData = Array(100).fill(null);
    renderizarPantalla();
  });
}

// Guardar en Firestore
async function actualizarServidor(nuevaData) {
  if (!auth.currentUser) return;
  
  try {
    const docRef = getDocRef();
    const dataLimpia = nuevaData.map(item => item ? { 
      nombre: item.nombre, 
      telefono: item.telefono,
      fecha: new Date().toISOString()
    } : null);
    
    await setDoc(docRef, { 
      numeros: dataLimpia,
      ultimaActualizacion: new Date().toISOString()
    });
    console.log("✅ Datos guardados en Firebase");
  } catch (error) {
    console.error("❌ Error al guardar:", error);
    alert("Error de conexión. Los datos se guardarán localmente.");
  }
}

// Renderizar números
window.renderizarPantalla = function() {
  const grid = document.getElementById('grid-rifa');
  if (!grid) return;
  
  grid.innerHTML = '';
  let contador = 0;
  
  rifaData.forEach((dato, i) => {
    const ocupado = dato !== null;
    const celda = document.createElement('div');
    celda.className = `h-14 flex items-center justify-center rounded-xl text-2xl font-black cursor-pointer transition-all active:scale-90 select-none shadow-sm ${
      ocupado ? 'bg-red-600 text-white shadow-inner border-b-4 border-red-800' : 'bg-white text-zinc-800 border-2 border-zinc-100 hover:border-red-400'
    }`;
    celda.innerText = i.toString().padStart(2, '0');
    celda.onclick = () => abrirVentana(i);
    grid.appendChild(celda);
    if (ocupado) contador++;
  });
  
  const vendidosCount = document.getElementById('vendidos-count');
  if (vendidosCount) vendidosCount.innerText = contador;
};

// Abrir modal de número
window.abrirVentana = function(index) {
  currentNumIndex = index;
  const data = rifaData[index];
  const estaOcupado = data !== null;
  
  document.getElementById('modal-titulo').innerText = estaOcupado ? "🔒 Número Reservado" : "✨ Elegir Número";
  document.getElementById('num-badge').innerText = `#${index.toString().padStart(2, '0')}`;
  document.getElementById('in-nombre').value = estaOcupado ? data.nombre : '';
  document.getElementById('in-tel').value = estaOcupado ? data.telefono : '';
  
  const btnConfirmar = document.getElementById('btn-confirmar');
  const btnBorrar = document.getElementById('btn-borrar');
  
  if (btnConfirmar) btnConfirmar.classList.toggle('hidden', estaOcupado);
  if (btnBorrar) btnBorrar.classList.toggle('hidden', !estaOcupado);
  
  document.getElementById('modal-main').classList.remove('hidden');
};

// Cerrar modal
window.cerrarVentana = function() {
  document.getElementById('modal-main').classList.add('hidden');
};

// Confirmar reserva
window.confirmarReserva = async function() {
  const nom = document.getElementById('in-nombre').value.trim();
  const tel = document.getElementById('in-tel').value.trim() || "Sin teléfono";
  
  if (!nom) {
    alert("⚠️ Por favor, escribe el nombre del comprador");
    return;
  }
  
  if (rifaData[currentNumIndex] !== null) {
    alert("❌ Este número ya está reservado");
    cerrarVentana();
    return;
  }
  
  rifaData[currentNumIndex] = { nombre: nom, telefono: tel };
  await actualizarServidor(rifaData);
  cerrarVentana();
  renderizarPantalla();
};

// Liberar número (solo admin)
window.liberarNumero = function() {
  accionPendiente = 'liberar';
  document.getElementById('input-pass').value = '';
  document.getElementById('modal-pass').classList.remove('hidden');
};

// Verificar clave maestra
window.verificarClave = async function() {
  const pass = document.getElementById('input-pass').value;
  
  if (pass === CLAVE_MAESTRA) {
    if (accionPendiente === 'liberar' && currentNumIndex !== null) {
      rifaData[currentNumIndex] = null;
      await actualizarServidor(rifaData);
      cerrarVentana();
      renderizarPantalla();
      alert("✅ Número liberado correctamente");
    }
    if (accionPendiente === 'admin') {
      abrirPanelAdmin();
    }
    document.getElementById('modal-pass').classList.add('hidden');
  } else {
    alert("❌ Clave incorrecta");
    document.getElementById('input-pass').value = '';
  }
};

// Abrir panel admin
window.panelAdmin = function() {
  accionPendiente = 'admin';
  document.getElementById('input-pass').value = '';
  document.getElementById('modal-pass').classList.remove('hidden');
};

// Actualizar panel admin
function actualizarPanelAdmin() {
  const listado = document.getElementById('lista-cuerpo');
  if (!listado) return;
  
  listado.innerHTML = '';
  let vendidos = 0;
  
  rifaData.forEach((d, i) => {
    if (d && d.nombre) {
      vendidos++;
      listado.innerHTML += `
        <tr class="border-b hover:bg-zinc-50">
          <td class="p-3 font-bold text-red-600">#${i.toString().padStart(2, '0')}</td>
          <td class="p-3 font-bold uppercase text-xs">${escapeHtml(d.nombre)}</td>
          <td class="p-3 text-xs">${escapeHtml(d.telefono)}</td>
        </tr>
      `;
    }
  });
  
  if (vendidos === 0) {
    listado.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-zinc-400 font-bold uppercase text-xs">📭 No hay números vendidos aún</td></tr>';
  }
  
  const totalVendidos = document.getElementById('total-vendidos');
  const totalDisponibles = document.getElementById('total-disponibles');
  
  if (totalVendidos) totalVendidos.innerText = vendidos;
  if (totalDisponibles) totalDisponibles.innerText = 100 - vendidos;
}

// Abrir panel admin con datos actualizados
function abrirPanelAdmin() {
  actualizarPanelAdmin();
  document.getElementById('panel-admin').classList.remove('hidden');
}

// Helper para evitar XSS
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Iniciar
initAuth();
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
.font-impact { font-family: 'Archivo Black', sans-serif; }
body { -webkit-tap-highlight-color: transparent; }
</style>

</body>
</html>
