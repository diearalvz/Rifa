<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RIFA PROFESIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoA7Ehq4RlzJ7JC-U12yDZSUk05DdDSMM",
            authDomain: "rifa-mayo.firebaseapp.com",
            projectId: "rifa-mayo",
            storageBucket: "rifa-mayo.firebasestorage.app",
            messagingSenderId: "18488353754",
            appId: "1:18488353754:web:161d84e9ffca868de596e3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const appId = 'rifa_mayo_29_diego';
        let rifaData = Array(100).fill(null);
        let user = null;
        let currentNumIndex = null;
        const CLAVE_MAESTRA = "1234";

        // Render inicial vacío para velocidad instantánea
        window.addEventListener('DOMContentLoaded', () => {
            renderizarPantalla(); 
        });

        async function iniciarAuth() {
            try {
                await setPersistence(auth, browserLocalPersistence);
                if (!auth.currentUser) await signInAnonymously(auth);
            } catch (err) { setTimeout(iniciarAuth, 1000); }
        }

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) conectarBaseDeDatos();
        });

        iniciarAuth();

        function getDocRef() {
            return doc(db, 'artifacts', appId, 'public', 'data', 'rifa_global', 'estado_oficial');
        }

        function conectarBaseDeDatos() {
            onSnapshot(getDocRef(), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    rifaData = data.numeros || data.numbers || Array(100).fill(null);
                }
                renderizarPantalla();
            });
        }

        async function actualizarServidor(nuevaData) {
            if (!user) return;
            try {
                const dataLimpia = nuevaData.map(item => item ? { 
                    nombre: item.nombre, 
                    telefono: item.telefono,
                    metodo: item.metodo || null 
                } : null);
                await setDoc(getDocRef(), { numeros: dataLimpia });
            } catch (error) { console.error("Error:", error); }
        }

        window.renderizarPantalla = function() {
            const grid = document.getElementById('grid-rifa');
            if (!grid) return;
            grid.innerHTML = '';
            let contador = 0;
            rifaData.forEach((dato, i) => {
                const ocupado = dato !== null;
                const celda = document.createElement('div');
                celda.className = `h-14 flex items-center justify-center rounded-2xl text-xl font-black cursor-pointer transition-all active:scale-90 shadow-sm border-2 ${ocupado ? 'bg-orange-600 text-white border-orange-800' : 'bg-white text-slate-800 border-slate-100'}`;
                celda.innerText = i.toString().padStart(2, '0');
                celda.onclick = () => abrirVentana(i);
                grid.appendChild(celda);
                if (ocupado) contador++;
            });
            document.getElementById('vendidos-count').innerText = contador;
        };

        window.abrirVentana = function(index) {
            currentNumIndex = index;
            const data = rifaData[index];
            document.getElementById('num-badge').innerText = `#${index.toString().padStart(2, '0')}`;
            if (data) {
                document.getElementById('modal-info-nombre').innerText = data.nombre;
                document.getElementById('modal-info-tel').innerText = data.telefono || "Sin teléfono";
                document.getElementById('view-registro').classList.add('hidden');
                document.getElementById('view-ocupado').classList.remove('hidden');
                document.getElementById('btn-guardar-modal').classList.add('hidden');
                document.getElementById('btn-liberar-directo').classList.remove('hidden');
            } else {
                document.getElementById('in-nombre').value = '';
                document.getElementById('in-tel').value = '';
                document.getElementById('view-registro').classList.remove('hidden');
                document.getElementById('view-ocupado').classList.add('hidden');
                document.getElementById('btn-guardar-modal').classList.remove('hidden');
                document.getElementById('btn-liberar-directo').classList.add('hidden');
            }
            document.getElementById('modal-main').classList.remove('hidden');
        };

        window.cerrarVentana = () => document.getElementById('modal-main').classList.add('hidden');

        window.guardarReserva = async function() {
            const nom = document.getElementById('in-nombre').value.trim();
            const tel = document.getElementById('in-tel').value.trim();
            if (!nom) return;
            rifaData[currentNumIndex] = { nombre: nom, telefono: tel };
            renderizarPantalla(); // Feedback instantáneo
            cerrarVentana();
            await actualizarServidor(rifaData);
        };

        window.liberarConClave = function() {
            const pass = prompt("Introduce la clave maestra:");
            if (pass === CLAVE_MAESTRA) {
                rifaData[currentNumIndex] = null;
                renderizarPantalla();
                cerrarVentana();
                actualizarServidor(rifaData);
            }
        };

        window.copiarTexto = function(texto, id) {
            const aux = document.createElement("input");
            aux.setAttribute("value", texto.replace(/\s/g, ''));
            document.body.appendChild(aux);
            aux.select();
            document.execCommand("copy");
            document.body.removeChild(aux);
            const el = document.getElementById(id);
            const original = el.innerText;
            el.innerText = "¡COPIADO!";
            setTimeout(() => el.innerText = original, 1000);
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;900&family=Oswald:wght@700&display=swap');
        
        .font-title { font-family: 'Bebas Neue', cursive; }
        .font-main { font-family: 'Inter', sans-serif; }
        .font-prize { font-family: 'Oswald', sans-serif; }

        .text-glow-orange {
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.8), 0 0 20px rgba(249, 115, 22, 0.4);
        }

        /* Ajuste dinámico para que el millón nunca se corte */
        .monto-millon {
            font-size: clamp(4rem, 18vw, 7rem);
            line-height: 1;
            background: linear-gradient(to bottom, #ffffff 40%, #ffedd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(251, 146, 60, 0.4));
        }

        .header-rifa {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="bg-slate-100 font-main text-slate-900 select-none">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl overflow-hidden flex flex-col">
        
        <!-- HEADER -->
        <div class="header-rifa pt-10 pb-12 px-6 text-center border-b-4 border-orange-600 relative">
            <h1 class="font-title text-5xl text-orange-500 tracking-[0.2em] mb-2 text-glow-orange italic">RIFA</h1>
            
            <div class="inline-block bg-orange-600/10 border border-orange-500/30 px-4 py-1 rounded-full mb-6">
                <span class="text-[10px] font-black uppercase tracking-widest text-orange-400">MAY 29 • LOTERÍA DE MEDELLÍN</span>
            </div>

            <div class="relative mb-6">
                <p class="font-prize monto-millon uppercase italic tracking-tighter">
                    $1.000.000
                </p>
            </div>

            <div class="inline-flex flex-col bg-orange-600 px-8 py-3 rounded-2xl shadow-[0_10px_30px_rgba(234,88,12,0.4)]">
                <span class="text-[9px] font-black text-orange-200 uppercase tracking-widest mb-1">VALOR DEL CUPO</span>
                <span class="font-title text-4xl text-white tracking-widest">$20.000</span>
            </div>
        </div>

        <!-- PAGOS RÁPIDOS -->
        <div class="grid grid-cols-3 gap-2 p-3 bg-slate-50 border-b">
            <div onclick="copiarTexto('000000000', 'bc-lbl')" class="bg-white p-3 rounded-xl border flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
                <span id="bc-lbl" class="text-[8px] font-black text-slate-400 uppercase mb-1">BANCOLOMBIA</span>
                <span class="font-title text-lg text-slate-700 leading-none">000-000</span>
            </div>
            <div onclick="copiarTexto('300000000', 'nq-lbl')" class="bg-white p-3 rounded-xl border border-t-4 border-t-[#FF00BF] flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
                <span id="nq-lbl" class="text-[8px] font-black text-[#FF00BF] uppercase mb-1">NEQUI</span>
                <span class="font-title text-lg text-slate-700 leading-none">300 000</span>
            </div>
            <div class="bg-white p-3 rounded-xl border flex flex-col items-center justify-center">
                <span id="vendidos-count" class="font-title text-2xl text-orange-600 leading-none">0</span>
                <span class="text-[8px] font-bold text-slate-300 uppercase leading-none tracking-tighter">VENDIDOS</span>
            </div>
        </div>

        <!-- CUADRÍCULA -->
        <div id="grid-rifa" class="grid grid-cols-4 gap-3 p-6 flex-1"></div>

        <div class="p-6 text-center opacity-30">
            <p class="text-[8px] font-black tracking-[0.5em] text-slate-400 uppercase">Plataforma Premium de Rifa</p>
        </div>
    </div>

    <!-- MODAL REGISTRO -->
    <div id="modal-main" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] w-full max-w-xs overflow-hidden shadow-2xl">
            <div class="p-8 text-center bg-slate-50 border-b">
                <p id="num-badge" class="text-8xl font-title text-orange-600 leading-none">#--</p>
            </div>
            <div class="p-6 space-y-4">
                <div id="view-registro" class="space-y-3">
                    <input type="text" id="in-nombre" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-bold outline-none focus:border-orange-500" placeholder="Nombre completo">
                    <input type="tel" id="in-tel" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-bold outline-none focus:border-orange-500" placeholder="WhatsApp">
                </div>
                <div id="view-ocupado" class="hidden text-center bg-orange-50 p-4 rounded-xl">
                    <p class="text-[10px] font-black text-orange-400 uppercase mb-1">RESERVADO POR</p>
                    <p id="modal-info-nombre" class="text-xl font-bold text-slate-800">---</p>
                    <p id="modal-info-tel" class="text-xs font-mono text-slate-400">---</p>
                </div>
                <button id="btn-guardar-modal" onclick="guardarReserva()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-title text-2xl uppercase tracking-widest active:scale-95 transition-all">RESERVAR</button>
                <button id="btn-liberar-directo" onclick="liberarConClave()" class="hidden w-full text-red-500 font-bold text-xs uppercase py-2">Liberar Cupo</button>
                <button onclick="cerrarVentana()" class="w-full text-slate-400 text-[10px] font-bold uppercase py-2">Cancelar</button>
            </div>
        </div>
    </div>

</body>
</html>
